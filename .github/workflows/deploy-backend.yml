name: Deploy Backend to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy application via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy NestJS backend via Docker" \
            --parameters commands='[
              "cd /home/ec2-user/app",
              "git pull origin main",
              "docker build -t backend-api .",
              "docker stop backend-api || true",
              "docker rm backend-api || true",
              "SECRETS=$(aws secretsmanager get-secret-value --secret-id biota-geom-app-secrets --region ${{ secrets.AWS_REGION }} --query SecretString --output text)",
              "DATABASE_URL=$(echo $SECRETS | jq -r .DATABASE_URL)",
              "JWT_SECRET=$(echo $SECRETS | jq -r .JWT_SECRET)",
              "FRONTEND_URL=$(echo $SECRETS | jq -r .FRONTEND_URL)",
              "AWS_BEARER_TOKEN_BEDROCK=$(echo $SECRETS | jq -r .AWS_BEARER_TOKEN_BEDROCK//empty)",
              "docker run --rm -e DATABASE_URL=\"$DATABASE_URL\" backend-api npx prisma migrate deploy",
              "docker stop backend-api || true",
              "docker rm backend-api || true",
              "docker run -d --name backend-api --restart always -p 3000:3000 -e PORT=3000 -e NODE_ENV=production -e DATABASE_URL=\"$DATABASE_URL\" -e JWT_ACCESS_SECRET=\"${JWT_SECRET}_access\" -e JWT_REFRESH_SECRET=\"${JWT_SECRET}_refresh\" -e CORS_ORIGINS=\"$FRONTEND_URL\" -e FRONTEND_URL=\"$FRONTEND_URL\" -e STORAGE_DRIVER=s3 -e AWS_S3_BUCKET=\"biota-geom-private-docs-prod\" -e AWS_REGION=\"${{ secrets.AWS_REGION }}\" -e AWS_ACCESS_KEY_ID=\"instance-profile-managed\" -e AWS_SECRET_ACCESS_KEY=\"instance-profile-managed\" -e AWS_BEARER_TOKEN_BEDROCK=\"$AWS_BEARER_TOKEN_BEDROCK\" -e BEDROCK_MODEL_ID=\"global.anthropic.claude-sonnet-5-5\" backend-api"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Comando enviado para a instância. ID: $COMMAND_ID. A aguardar conclusão..."


          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
