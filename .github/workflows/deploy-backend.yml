name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy application via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy NestJS backend via Docker" \
            --parameters commands='[
              "cd /home/ec2-user/app",
              "git pull origin main",
              "docker build -t backend-api .",
              "docker stop backend-api || true",
              "docker rm backend-api || true",
              "SECRETS=$(aws secretsmanager get-secret-value --secret-id Biota-Geom-app-secrets-EFMnK2 --region ${{ secrets.AWS_REGION }} --query SecretString --output text)",
              "DATABASE_URL=$(echo $SECRETS | jq -r .DATABASE_URL)",
              "JWT_SECRET=$(echo $SECRETS | jq -r .JWT_SECRET)",
              "FRONTEND_URL=$(echo $SECRETS | jq -r .FRONTEND_URL)",
              "docker run -d --name backend-api --restart always -p 3000:3000 -e PORT=3000 -e NODE_ENV=production -e DATABASE_URL=\"$DATABASE_URL\" -e JWT_SECRET=\"$JWT_SECRET\" -e CORS_ORIGINS=\"$FRONTEND_URL\" -e FRONTEND_URL=\"$FRONTEND_URL\" -e STORAGE_DRIVER=s3 -e S3_BUCKET_NAME=\"biota-geom-private-docs-prod\" -e AWS_REGION=\"${{ secrets.AWS_REGION }}\" backend-api"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Comando enviado para a instância. ID: $COMMAND_ID. A aguardar conclusão..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
