services:
  api:
    build:
      context: .
    container_name: biota-geom-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://biota:biota@postgres:5432/biota_geom?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      JWT_ISSUER: ${JWT_ISSUER:-biota-geom-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-biota-geom-web}
      AUTH_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN:-biotageom.com.br}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    container_name: biota-geom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: biota
      POSTGRES_PASSWORD: biota
      POSTGRES_DB: biota_geom
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U biota -d biota_geom']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
